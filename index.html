<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Inter is self-hosted (ASP-47). The @font-face is in src/index.css.
         This preload starts the download in parallel with the stylesheet
         rather than after the browser has parsed it and discovered the
         @font-face — a font referenced from CSS is otherwise found late.
         crossorigin is REQUIRED even same-origin: fonts are fetched in CORS
         mode, and without it the browser downloads the file twice. -->
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font"
          type="font/woff2" crossorigin />
    <meta name="description" content="ALFI Swiss Partners is an independent wealth advisory firm in Geneva, providing senior-level counsel and introductions to leading private banks." />
    <meta property="og:site_name" content="ALFI Swiss Partners" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ALFI Swiss Partners" />
    <meta property="og:url" content="https://alfiswisspartners.com" />
    <meta property="og:image" content="https://alfiswisspartners.com/images/home-positioning-1200w.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The hero preload used to live here and was moved out in ASP-47.
         This file is the SPA shell served for EVERY route, so a preload in
         it made all six pages fetch the home hero at high priority — 362KB
         on five pages that never render it, 48% of /contact's entire weight.
         It is now a `Link:` response header scoped to "/" in netlify.toml,
         which is both earlier than markup and limited to the one page that
         needs it. The Apache side needs the same header; see public/.htaccess. -->
    <title>ALFI Swiss Partners</title>
    <script>
      /* ASP-24 — set the reveal opt-in BEFORE first paint.
         Doing this in React's effect instead would paint the content, then
         hide it, then reveal it: a visible blink on every load.

         Deliberately inline and synchronous. If this script never runs — JS
         off, CSP, a parse error — the class is absent, nothing is hidden and
         the page renders complete. src/lib/reveal.js removes the class again
         if it finds it cannot observe, so the content can never be left
         stranded at opacity 0.

         NOT gated on prefers-reduced-motion. That gate was the first version
         and it was wrong: it removed the animation entirely for anyone with
         the setting on, which is a large share of Windows machines and
         included the people who commissioned it. The preference is honoured
         in CSS instead, where `reduce` keeps the fade and drops the movement —
         see the reduced-motion block beside `.u-reveal` in index.css. */
      try {
        document.documentElement.classList.add('js-motion')
      } catch (e) { /* leave the page visible */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
